services:
  resemblyzer:
    build:
      context: .
      dockerfile: Dockerfile.runpod
    ports:
      - "8000:8000"
    volumes:
      - audio_cache:/app/audio_cache
      - ./audio_data:/app/audio_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - RUNPOD_DEBUG_LEVEL=DEBUG

volumes:
  audio_cache:
